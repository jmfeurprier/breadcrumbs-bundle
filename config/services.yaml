services:

    _defaults:
        autoconfigure: true
        autowire:      true

    Jmf\Breadcrumbs\:
        resource: '../src/'
        exclude:
            - '../src/Configuration/BreadcrumbsConfigurationLoader.php'
            - '../src/Definition/'
            - '../src/Exception/'
            - '../src/Model/'
            - '../src/Registry/'
            - '../src/Resolution/CurrentBreadcrumbsResolver.php'
            - '../src/Resolution/CurrentBreadcrumbsResolverFactory.php'
            - '../src/JmfBreadcrumbsBundle.php'

    Jmf\Breadcrumbs\Registry\BreadcrumbDefinitionRegistryInterface:
        factory: [ '@Jmf\Breadcrumbs\Registry\BreadcrumbDefinitionRegistryFactory', 'create' ]

    Jmf\Breadcrumbs\Registry\BreadcrumbDefinitionRegistryFactory:
        arguments:
            $config: '%jmf_breadcrumbs.breadcrumbs_config%'

    Jmf\Breadcrumbs\Resolution\CurrentBreadcrumbsResolverInterface:
        factory: [ '@Jmf\Breadcrumbs\Resolution\CurrentBreadcrumbsResolverFactory', 'create' ]

    Jmf\Breadcrumbs\Resolution\CurrentBreadcrumbsResolverFactory:
        arguments:
            $currentBreadcrumbNotFoundStrategy: '%jmf_breadcrumbs.current_breadcrumb_not_found_strategy%'

    Jmf\Breadcrumbs\Resolution\PreviousBreadcrumbResolverInterface:
        class: Jmf\Breadcrumbs\Resolution\PreviousBreadcrumbResolver

    Jmf\Breadcrumbs\Twig\BreadcrumbsExtension:
        arguments:
            $templatePath: '%jmf_breadcrumbs.template_path%'
            $prefix:       '%jmf_breadcrumbs.twig_functions_prefix%'

    Jmf\TemplateRendering\TemplateRendererInterface:
        class: Jmf\TemplateRendering\TemplateRenderer
